name: Build

on:
  push:
  pull_request:
    # labeled/unlabeled: re-run when the "accepted regression" label changes
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  build:
    # Private build container
    container: ghcr.io/pbr-ret/pbr-decomp-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add game versions here
        version: [RPBP01]

    steps:
    # Checkout the repository (full history: the quality checks build the base commit)
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -R /orig .

    # Build the project
    - name: Build
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source progress build/${{ matrix.version }}/report.json

    # Compare the change with its base: compiler diagnostics, symbols,
    # match regressions and symbols.txt drift (see docs/quality.md)
    - name: Quality checks
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        QA_ACCEPT_REGRESSIONS: ${{ contains(github.event.pull_request.labels.*.name, 'accepted regression') && '1' || '0' }}
      run: |
        python tools/qa/check.py --with-dol --only diagnostics,symbols,regressions,apply \
            --base "$BASE" \
            --configure-args "--map --version ${{ matrix.version }} --binutils /binutils --compilers /compilers"

    # Upload map files
    - name: Upload map
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install tools
      run: pip install clang-format==23.1.3 -r tools/decomp/requirements.txt

    # clang-format on the changed files, and the fakematch lint on the added lines
    - name: Format and lint
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: python tools/qa/check.py --only format,lint --base "$BASE"
